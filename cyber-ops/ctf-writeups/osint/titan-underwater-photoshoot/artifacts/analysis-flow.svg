<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 912" role="img" aria-labelledby="title desc">
  <title id="title">Titan geo-OSINT evidence path</title>
  <desc id="desc">The challenge phrase leads to a Guinness record, the Barracuda Rock venue, a bounded coordinate search, a manual pin read, and a case-reported accepted answer. Three tempting name and category matches are rejected.</desc>
  <defs>
    <marker id="main-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#35e0d0"/>
    </marker>
    <marker id="branch-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#ffb366"/>
    </marker>
  </defs>
  <rect width="640" height="912" rx="12" fill="#0c1018"/>
  <text x="24" y="32" fill="#e6e9f0" font-family="system-ui, sans-serif" font-size="18" font-weight="700">From record phrase to map pin</text>
  <text x="24" y="53" fill="#9faab9" font-family="system-ui, sans-serif" font-size="12">Solid path: evidence and action. Dashed branches: discarded matches.</text>

  <g fill="none" stroke="#35e0d0" stroke-width="2" marker-end="url(#main-arrow)">
    <path d="M217 130 V151"/>
    <path d="M217 225 V246"/>
    <path d="M217 320 V341"/>
    <path d="M217 415 V436"/>
    <path d="M217 510 V531"/>
    <path d="M217 605 V626"/>
    <path d="M217 700 V721"/>
  </g>
  <g fill="none" stroke="#ffb366" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#branch-arrow)">
    <path d="M410 188 H432"/>
    <path d="M410 199 H423 V262 H432"/>
    <path d="M410 473 H432"/>
  </g>

  <g fill="#151c27" stroke="#35656c" stroke-width="1.5">
    <rect x="24" y="65" width="386" height="65" rx="8"/>
    <rect x="24" y="160" width="386" height="65" rx="8"/>
    <rect x="24" y="255" width="386" height="65" rx="8"/>
    <rect x="24" y="350" width="386" height="65" rx="8"/>
    <rect x="24" y="445" width="386" height="65" rx="8"/>
    <rect x="24" y="540" width="386" height="65" rx="8"/>
    <rect x="24" y="635" width="386" height="65" rx="8"/>
    <rect x="24" y="730" width="386" height="65" rx="8"/>
  </g>
  <g fill="#25202a" stroke="#9a6749" stroke-width="1.5">
    <rect x="438" y="160" width="178" height="65" rx="8"/>
    <rect x="438" y="255" width="178" height="65" rx="8"/>
    <rect x="438" y="445" width="178" height="65" rx="8"/>
  </g>

  <g font-family="system-ui, sans-serif" font-size="14" font-weight="650" fill="#35e0d0">
    <text x="39" y="90">Challenge phrase</text>
    <text x="39" y="185">QRY-001: search the exact phrase</text>
    <text x="39" y="280">SRC-001: Guinness record</text>
    <text x="39" y="375">E-001: venue string</text>
    <text x="39" y="470">QRY-002 to 008; SRC-005 fetch</text>
    <text x="39" y="565">E-006: bounded negative</text>
    <text x="39" y="660">ACT-9: manual pin read</text>
    <text x="39" y="755">Reported first acceptance</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="12.5" fill="#e6e9f0">
    <text x="39" y="112">Deepest underwater product photoshoot</text>
    <text x="39" y="207">Record category, before guessing a location</text>
    <text x="39" y="302">Titan Watches; 52.1 m; 29 Mar 2026</text>
    <text x="39" y="397">Barracuda Rock, Racha Noi, Phuket</text>
    <text x="39" y="492">No usable six-decimal value in checked pages</text>
    <text x="39" y="587">Inspect the named site's interactive map pin</text>
    <text x="39" y="682">Six-decimal pin (withheld)</text>
    <text x="39" y="777">13 Aug 2026, after the listed event window</text>
  </g>
  <g font-family="system-ui, sans-serif" fill="#ffb366">
    <text x="450" y="185" font-size="13" font-weight="650">HYP-B rejected</text>
    <text x="450" y="207" font-size="12">Titan / OceanGate</text>
    <text x="450" y="280" font-size="13" font-weight="650">HYP-C rejected</text>
    <text x="450" y="302" font-size="12">Model shoot in Florida</text>
    <text x="450" y="470" font-size="13" font-weight="650">HYP-D excluded</text>
    <text x="450" y="492" font-size="12">Raja Ampat namesake</text>
  </g>

  <rect x="24" y="818" width="592" height="70" rx="8" fill="#161c26" stroke="#313b4a"/>
  <text x="38" y="843" fill="#ff4d9d" font-family="system-ui, sans-serif" font-size="13" font-weight="650">Evidence boundary</text>
  <text x="38" y="864" fill="#e6e9f0" font-family="system-ui, sans-serif" font-size="12">The point and acceptance are case-recorded. No pin permalink or</text>
  <text x="38" y="880" fill="#e6e9f0" font-family="system-ui, sans-serif" font-size="12">submission receipt survives for an independent replay.</text>
</svg>
