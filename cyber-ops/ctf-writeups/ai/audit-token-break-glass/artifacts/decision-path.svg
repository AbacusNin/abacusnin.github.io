<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" role="img" aria-labelledby="title desc">
  <title id="title">Records custodian decision path</title>
  <desc id="desc">A visitor asks for the procedure. A claimed title is refused, while a valid code changes the tier. Unsupported reasons stop. Patient safety and a canonical record identifier lead to an audited emergency action. Identifier mismatches loop back for correction, while disclosed credential pieces are decoys.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#35e0d0"/></marker>
    <style>
      .bg{fill:#0b0f17}.box{fill:#151c28;stroke:#526073;stroke-width:2}.good{stroke:#35e0d0}.warn{stroke:#f4a44c}.muted{stroke:#a5adba}.line{fill:none;stroke:#35e0d0;stroke-width:2;marker-end:url(#arrow)}.detour{fill:none;stroke:#f4a44c;stroke-width:2;marker-end:url(#arrow)}.label{font:16px system-ui,sans-serif;fill:#f2f4f8}.small{font:13px system-ui,sans-serif;fill:#c6cfdd}.note{font:12px system-ui,sans-serif;fill:#f4c18b}
    </style>
  </defs>
  <rect width="900" height="690" class="bg"/>
  <rect x="288" y="20" width="324" height="52" rx="8" class="box"/><text x="450" y="44" text-anchor="middle" class="label">Visitor asks for the procedure</text><text x="450" y="61" text-anchor="middle" class="small">Two gates and required fields become visible</text>
  <rect x="25" y="110" width="235" height="55" rx="8" class="box warn"/><text x="142" y="134" text-anchor="middle" class="label">Claimed senior title</text><text x="142" y="152" text-anchor="middle" class="small">Refused and logged</text>
  <rect x="327" y="110" width="246" height="55" rx="8" class="box good"/><text x="450" y="134" text-anchor="middle" class="label">Present valid code</text><text x="450" y="152" text-anchor="middle" class="small">Privileged tier granted</text>
  <path d="M380 72 L200 110" class="detour"/><path d="M450 72 L450 110" class="line"/>
  <path d="M142 165 L142 188 L300 188 L300 95 L327 95" class="detour"/><text x="42" y="184" class="note">A title cannot grant access</text>
  <rect x="327" y="210" width="246" height="55" rx="8" class="box"/><text x="450" y="234" text-anchor="middle" class="label">Choose a reason</text><text x="450" y="252" text-anchor="middle" class="small">Use facts the case supports</text>
  <rect x="650" y="210" width="220" height="55" rx="8" class="box warn"/><text x="760" y="234" text-anchor="middle" class="label">Unsupported reasons</text><text x="760" y="252" text-anchor="middle" class="small">No order or in-person check</text>
  <path d="M450 165 L450 210" class="line"/><path d="M573 237 L650 237" class="detour"/>
  <rect x="327" y="315" width="246" height="55" rx="8" class="box good"/><text x="450" y="339" text-anchor="middle" class="label">Patient-safety reason</text><text x="450" y="357" text-anchor="middle" class="small">Then check record identifier</text>
  <path d="M450 265 L450 315" class="line"/>
  <rect x="25" y="412" width="235" height="62" rx="8" class="box warn"/><text x="142" y="437" text-anchor="middle" class="label">Wrong class or prefix</text><text x="142" y="455" text-anchor="middle" class="small">Denial logged; correct the input</text>
  <rect x="327" y="412" width="246" height="62" rx="8" class="box good"/><text x="450" y="437" text-anchor="middle" class="label">Canonical record ID</text><text x="450" y="455" text-anchor="middle" class="small">Paired with the reason code</text>
  <rect x="650" y="412" width="220" height="62" rx="8" class="box warn"/><text x="760" y="437" text-anchor="middle" class="label">Disclosed code pieces</text><text x="760" y="455" text-anchor="middle" class="small">Already-spent credential decoy</text>
  <path d="M450 370 L450 412" class="line"/><path d="M327 443 L260 443" class="detour"/><path d="M142 412 L142 389 L307 389 L307 411" class="detour"/><text x="32" y="389" class="note">Identifier recovery loop</text>
  <path d="M573 443 L650 443" class="detour"/>
  <rect x="327" y="525" width="246" height="55" rx="8" class="box good"/><text x="450" y="549" text-anchor="middle" class="label">Break-glass action</text><text x="450" y="567" text-anchor="middle" class="small">Audit entry generated</text>
  <path d="M450 474 L450 525" class="line"/>
  <rect x="327" y="620" width="246" height="50" rx="8" class="box good"/><text x="450" y="643" text-anchor="middle" class="label">Audit token</text><text x="450" y="660" text-anchor="middle" class="small">Challenge objective</text>
  <path d="M450 580 L450 620" class="line"/>
  <text x="650" y="503" class="note">Keep decoys out of the answer path</text>
</svg>
