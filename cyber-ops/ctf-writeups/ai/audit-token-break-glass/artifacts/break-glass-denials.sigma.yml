title: Three Record Identifier Denials in Fifteen Minutes
id: f291f2f2-579a-4951-a166-c3eb0392d618
status: experimental
description: Three identifier mismatch denials in one session within fifteen minutes.
correlation:
  type: event_count
  rules:
    - emergency_access_identifier_denial
  group-by:
    - session_id
  timespan: 15m
  condition:
    gte: 3
falsepositives:
  - Repeated operator mistypes or retries with a stale identifier
level: medium
