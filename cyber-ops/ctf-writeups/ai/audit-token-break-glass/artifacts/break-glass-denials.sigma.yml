title: Repeated Record Identifier Denials During Emergency Access
id: 23bcdd3f-8063-4e67-bfb5-819a9560335a
name: emergency_access_identifier_denial
status: experimental
description: One emergency-access request was denied for a record identifier mismatch.
logsource:
  product: ehr
  service: records-custodian
detection:
  selection:
    event_type: break_glass_attempt
    result: deny
    deny_reason: MRN mismatch
  condition: selection
fields:
  - session_id
  - actor_tier
  - deny_reason
falsepositives:
  - Mistyped identifier during a genuine emergency
level: informational
