<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" role="img" aria-labelledby="title description">
  <title id="title">Clinician-note trust boundary</title>
  <desc id="description">A requester writes a referral with a clinical body and a clinician note. Both reach a triage assistant that can access a protected code. The assistant sends the code to an Escalation summary despite a stated verified-channel rule.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#46dccb"/></marker>
    <marker id="warn" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ff76a8"/></marker>
  </defs>
  <rect width="960" height="590" rx="18" fill="#0c1019"/>
  <text x="30" y="34" fill="#f4f5f7" font-family="Arial,sans-serif" font-size="22" font-weight="bold">Where the referral crossed the trust boundary</text>
  <g fill="#151d2a" stroke="#365062" stroke-width="2">
    <rect x="28" y="78" width="180" height="70" rx="10"/>
    <rect x="300" y="78" width="205" height="70" rx="10"/>
    <rect x="300" y="198" width="205" height="70" rx="10"/>
    <rect x="300" y="320" width="205" height="70" rx="10"/>
    <rect x="630" y="225" width="190" height="92" rx="10"/>
    <rect x="630" y="395" width="190" height="75" rx="10"/>
    <rect x="30" y="460" width="235" height="76" rx="10" stroke="#ff76a8"/>
    <rect x="330" y="460" width="235" height="76" rx="10" stroke="#ff76a8" stroke-dasharray="7 5"/>
  </g>
  <g fill="#f4f5f7" font-family="Arial,sans-serif" font-size="15">
    <text x="72" y="108">Untrusted</text><text x="70" y="130">requester</text>
    <text x="331" y="109">Referral document</text><text x="344" y="132" font-size="12">requester authored</text>
    <text x="322" y="229">Urgent clinical body</text><text x="346" y="250" font-size="12">business condition</text>
    <text x="337" y="350">CLINICIAN NOTE</text><text x="325" y="372" font-size="12">instruction in data field</text>
    <text x="658" y="261">Triage assistant</text><text x="667" y="285" font-size="12">privileged context</text>
    <text x="651" y="425">Escalation output</text><text x="648" y="448" font-size="12">protected code appeared</text>
    <text x="48" y="489">Protected escalation code</text><text x="83" y="512" font-size="12">reachable by assistant</text>
    <text x="357" y="489">Verified-channel rule</text><text x="350" y="512" font-size="12">stated, contradicted by output</text>
  </g>
  <g fill="none" stroke="#46dccb" stroke-width="3" marker-end="url(#arrow)">
    <path d="M208 113 H300"/>
    <path d="M402 148 V170 H275 V233 H300"/>
    <path d="M402 148 V170 H255 V355 H300"/>
    <path d="M505 233 H565 V250 H630"/>
    <path d="M505 355 H565 V290 H630"/>
    <path d="M725 317 V395"/>
    <path d="M265 498 H295 V550 H590 V300 H630"/>
  </g>
  <path d="M565 498 H600 V318 H630" fill="none" stroke="#ff76a8" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#warn)"/>
  <text x="30" y="568" fill="#aec0cc" font-family="Arial,sans-serif" font-size="14">Solid arrows show data and influence. Dashed arrow shows the claimed channel gate.</text>
</svg>
