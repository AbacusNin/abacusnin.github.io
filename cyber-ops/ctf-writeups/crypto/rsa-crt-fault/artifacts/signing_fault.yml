title: RSA Signing Service Output Validation Failure
id: 83e7384f-f965-46fb-bc03-5c7470443358
status: experimental
description: A signing service rejected a private-key operation because the result failed its own public verification check.
logsource:
  product: application
  service: signing-service
detection:
  selection:
    kind: fault_validation_failed
  condition: selection
fields:
  - time
  - client_id
  - key_id
falsepositives:
  - Test harnesses intentionally injecting a fault
level: critical
