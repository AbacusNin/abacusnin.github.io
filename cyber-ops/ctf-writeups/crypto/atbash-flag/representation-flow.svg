<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" role="img" aria-labelledby="title description">
  <title id="title">Atbash representation triage</title>
  <desc id="description">A flag-shaped token is inspected before choosing a transform. The observed route tries Atbash, checks the code's round trip and the flag format, then submits the answer. A byte-oriented XOR or hex pattern would require a different route and was not used for this token.</desc>
  <defs>
    <marker id="go" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#43d8c8"/></marker>
    <marker id="alt" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#ff789d"/></marker>
  </defs>
  <rect width="1020" height="540" rx="18" fill="#0c1019"/>
  <text x="32" y="42" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#f5f7f8">Inspect the token before choosing the transform</text>
  <g fill="#151e2b" stroke="#3d5b6c" stroke-width="2">
    <rect x="38" y="100" width="225" height="86" rx="10"/>
    <rect x="333" y="100" width="260" height="86" rx="10"/>
    <rect x="690" y="100" width="285" height="86" rx="10" stroke="#ff789d"/>
    <rect x="333" y="260" width="230" height="86" rx="10"/>
    <rect x="645" y="260" width="330" height="86" rx="10" stroke="#e2b970"/>
    <rect x="333" y="410" width="230" height="78" rx="10"/>
    <rect x="645" y="410" width="330" height="78" rx="10"/>
  </g>
  <g font-family="Arial,sans-serif" font-size="17" fill="#f5f7f8">
    <text x="61" y="135">Ciphertext token</text><text x="61" y="161" font-size="14">braces and underscores</text>
    <text x="355" y="135">Classify representation</text><text x="355" y="161" font-size="14">flag-shaped printable text</text>
    <text x="713" y="135">Different byte/key route</text><text x="713" y="161" font-size="14">if evidence supported XOR or hex</text>
    <text x="355" y="295">Apply Atbash</text><text x="355" y="321" font-size="14">reflect Latin letters only</text>
    <text x="667" y="295">Check the codec's round trip</text><text x="667" y="321" font-size="14">second pass restores input</text>
    <text x="355" y="443">Check flag shape</text><text x="355" y="468" font-size="14">readable candidate</text>
    <text x="667" y="443">Submit recovered answer</text><text x="667" y="468" font-size="14">platform acceptance recorded</text>
  </g>
  <g fill="none" stroke="#43d8c8" stroke-width="3" marker-end="url(#go)">
    <path d="M263 143 H333"/>
    <path d="M463 186 V260"/>
    <path d="M563 303 H645"/>
    <path d="M810 346 V375 H448 V410"/>
    <path d="M563 449 H645"/>
  </g>
  <path d="M593 143 H690" fill="none" stroke="#ff789d" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#alt)"/>
  <text x="33" y="523" font-family="Arial,sans-serif" font-size="13" fill="#b8c8d0">The round trip checks implementation behavior. It does not identify the cipher or prove the submitted answer.</text>
</svg>
