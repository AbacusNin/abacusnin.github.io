title: Numeric Endpoint Miss
name: numeric_endpoint_miss
id: 0d254fad-47b7-47d8-a104-4f390752e9b4
description: A 404 on a normalized numeric endpoint family.
logsource:
  category: webserver
detection:
  selection:
    status: 404
    path_family|exists: true
  condition: selection
fields:
  - src_ip
  - host
  - path
  - path_family
---
title: Numeric Endpoint Success
name: numeric_endpoint_success
id: 56bb6fcb-47ef-4d99-94d3-5a1af6b0a8cd
description: A 200 on a normalized numeric endpoint family.
logsource:
  category: webserver
detection:
  selection:
    status: 200
    path_family|exists: true
  condition: selection
fields:
  - src_ip
  - host
  - path
  - path_family
---
title: Many Distinct Numeric Endpoint Misses
name: many_numeric_endpoint_misses
id: 8672ca78-8ce2-4996-9a05-dc55e1e4b7aa
correlation:
  type: value_count
  rules:
    - numeric_endpoint_miss
  group-by:
    - src_ip
    - host
    - path_family
  timespan: 5m
  condition:
    field: path
    gte: 100
---
title: Numeric Endpoint Discovery After Enumeration
id: b3b1ced4-fae7-4403-8c8b-2f7874b0c136
status: experimental
description: A 200 follows at least 100 distinct numeric-path 404s for one client and host.
correlation:
  type: temporal_ordered
  rules:
    - many_numeric_endpoint_misses
    - numeric_endpoint_success
  group-by:
    - src_ip
    - host
    - path_family
  timespan: 5m
  condition:
    gte: 2
falsepositives:
  - Authorized testing or application clients probing an expected numeric path family.
level: medium
