<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Visibility boundary in the local HTTP upload case</title>
  <desc id="desc">The host capture shows the client sending indexed HTTP POST bodies to a loopback listener, enough to reconstruct the PNG. Off-host forwarding is outside the observed capture and needs separate endpoint or egress evidence. Perimeter logs do not see traffic that remains on the host.</desc>
  <rect width="920" height="430" rx="16" fill="#10141d"/>
  <g font-family="Arial, sans-serif" fill="#e6e9f0" text-anchor="middle">
    <text x="460" y="42" font-size="23" font-weight="bold">Where the capture stops</text>
    <rect x="30" y="80" width="580" height="220" rx="12" fill="#171f2b" stroke="#35e0d0" stroke-width="2"/>
    <text x="320" y="107" fill="#35e0d0" font-size="15">Observed on the host</text>
    <rect x="55" y="145" width="150" height="72" rx="8" fill="#23293a" stroke="#35e0d0"/>
    <text x="130" y="174" font-size="16">Client process</text><text x="130" y="196" font-size="12">identity not in PCAP</text>
    <rect x="260" y="145" width="150" height="72" rx="8" fill="#23293a" stroke="#35e0d0"/>
    <text x="335" y="173" font-size="16">HTTP POSTs</text><text x="335" y="196" font-size="12">index + tag + payload</text>
    <rect x="455" y="145" width="130" height="72" rx="8" fill="#23293a" stroke="#35e0d0"/>
    <text x="520" y="173" font-size="16">127.0.0.1</text><text x="520" y="196" font-size="12">local listener</text>
    <rect x="250" y="245" width="170" height="40" rx="8" fill="#23293a" stroke="#ff4d9d"/>
    <text x="335" y="270" font-size="15">Reconstructed PNG</text>
    <rect x="700" y="145" width="180" height="72" rx="8" fill="#23293a" stroke="#e6b45a" stroke-dasharray="6 5"/>
    <text x="790" y="174" font-size="16">Off-host relay?</text><text x="790" y="196" font-size="12">separate evidence needed</text>
    <text x="460" y="353" font-size="15">Endpoint capture sees loopback; perimeter sensors see only traffic that leaves the host.</text>
  </g>
  <g fill="none" stroke="#8f9ab0" stroke-width="2" marker-end="url(#arrow)">
    <path d="M205 181H260"/><path d="M410 181H455"/><path d="M335 217V245"/>
    <path d="M585 181H700" stroke-dasharray="6 5"/>
  </g>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8f9ab0"/></marker></defs>
</svg>
